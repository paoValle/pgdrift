[package]
name = "pgdrift"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
description = "Would this migration block production? A static verdict, and then a measurement against a real PostgreSQL."
license = "MIT"
readme = "README.md"
repository = "https://github.com/paoValle/pgdrift"
keywords = ["postgres", "migration", "locks", "schema", "ddl"]
categories = ["database", "development-tools"]

# One dependency: the PostgreSQL driver. The lexer, the rules, the probe and the audit queries are
# written here, because the tool's whole value is what it says about *them*.
[dependencies]
postgres = "0.19"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "allow"
expect_used = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
