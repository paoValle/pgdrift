name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pgdrift
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGDATA_UNUSED: ""
      DB_URL: postgres://postgres:pgdrift@127.0.0.1:55432/postgres
      # the row threshold the demo asks the fourth (judgement) check for, the same as `make`
      INT4_OVER: "1000000"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets

      # The verdict. Note what is *not* asserted: that the safe migration passes the same
      # threshold. It cannot — adding a nullable column is genuinely ACCESS EXCLUSIVE, briefly — and
      # a lock-level threshold cannot tell one millisecond from forty minutes. That is what `prove`
      # is for, and why both exist.
      - name: the static verdict
        run: |
          if cargo run --quiet --release -- plan --migration examples/0001-risky.sql --fail-on share; then
            echo "::error::the risky migration has a write-blocking build and was not flagged"; exit 1
          fi
          # nothing in the safe migration is outside the table: no guessing was needed
          cargo run --quiet --release -- plan --migration examples/0002-safe.sql --fail-on unknown

      # the measurement, against a real PostgreSQL
      - name: the measurement
        run: cargo run --quiet --release -- prove --db-url "$DB_URL" --migration examples/0001-risky.sql

      - name: what the schema already hides
        run: |
          # The same command as `make report`, `--warn-int4-over` included: that flag is what makes
          # the artifact uploaded here the document committed in `reports/`.
          cargo run --quiet --release -- report --db-url "$DB_URL" \
            --migration examples/0001-risky.sql --safe examples/0002-safe.sql \
            --seed examples/schema.sql --warn-int4-over "$INT4_OVER" --out reports/latest.md
          # The seeded schema has four known problems, and the fourth is a judgement that only runs
          # when asked for: the audit must find all four, not merely exit non-zero on the first
          # three. Without the flag the fourth line says it did not run, and this step proves it.
          if cargo run --quiet --release -- audit --db-url "$DB_URL" --warn-int4-over "$INT4_OVER" > audit.txt; then
            echo "::error::the audit found nothing in a schema with four known problems"; exit 1
          fi
          for check in "unindexed foreign key" "table without a primary key" "invalid index" "int4 primary key"; do
            grep -q "$check" audit.txt || { echo "::error::the audit did not report: $check"; exit 1; }
          done
          cat audit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/
